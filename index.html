async function refreshSharedDecks(){if(!syncUser||!syncClient)return false;let{data,error}=await syncClient.from('shared_decks').select('owner_id,deck_id,payload,updated_at').order('updated_at',{ascending:false});if(error)return false;let privateSets=(state.sets||[]).filter(s=>!s._shared);publishedDeckIds=new Set((data||[]).filter(r=>r.owner_id===syncUser.id).map(r=>r.deck_id));let shared=(data||[]).filter(r=>r.owner_id!==syncUser.id).map(r=>{let p=r.payload||{};return{...p,id:`shared:${r.owner_id}:${r.deck_id}`,folder:'',_shared:true,_owner_id:r.owner_id,cards:(Array.isArray(p.cards)?p.cards:[]).map((c,i)=>({...c,id:c.id||`${r.deck_id}-card-${i}`}))}});state.sets=[...privateSets,...shared];localStorage.setItem(KEY,JSON.stringify(state));return true}

async function toggleShareDeck(sid){let s=state.sets.find(x=>x.id===sid&&!x._shared);if(!s)return;if(!syncUser||!syncReady){toast('Hãy đăng nhập để chia sẻ bộ thẻ.');return}if(publishedDeckIds.has(sid)){let{error}=await syncClient.from('shared_decks').delete().eq('owner_id',syncUser.id).eq('deck_id',sid);if(error){syncStatus('Không ngừng chia sẻ được: '+error.message);toast('Không ngừng chia sẻ được.');return}publishedDeckIds.delete(sid);await refreshSharedDecks();render();toast('Đã ngừng chia sẻ bộ thẻ.')}else{if(!await upsertSharedDeck(s))return;publishedDeckIds.add(sid);await refreshSharedDecks();render();toast('Tài khoản khác đã có thể xem bộ thẻ này.')}}
function copySharedSet(sid){let s=setObj(sid);if(!s||!s._shared)return;let copy=JSON.parse(JSON.stringify(s));copy.id=id();copy.title+=' (bản sao)';copy.created=today();copy.folder=state.folders[0]||'';delete copy._shared;delete copy._owner_id;copy.cards.forEach(c=>c.id=id());state.sets.unshift(copy);save();render();toast('Đã sao chép bộ thẻ vào thư viện của bạn.')}async function syncCloudNow(){if(!syncReady||!syncUser||!syncClient)return;let{error}=await syncClient.from('personal_learning_data').upsert({user_id:syncUser.id,payload:accountPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){syncStatus('Chưa đồng bộ: '+error.message);return}syncStatus('Đã đồng bộ · '+syncUser.email)}
async function loadCloudForUser(user){syncReady=false;syncStatus('Đang tải dữ liệu riêng…');let{data,error}=await syncClient.from('personal_learning_data').select('payload').eq('user_id',user.id).maybeSingle();if(error){syncStatus('Không tải được dữ liệu: '+error.message);return false}if(data?.payload){localStorage.setItem(KEY+'-before-sync-'+user.id,JSON.stringify(state));state=data.payload;let oldSetCount=Array.isArray(state.sets)?state.sets.length:0;state.sets=Array.isArray(state.sets)?state.sets.filter(s=>!s._shared&&!(s.title==='Ôn tập hôm nay'&&s.folder==='Review')):[];if(state.sets.length<oldSetCount)legacyReviewCleaned=true;state.folders=Array.isArray(state.folders)?state.folders:[];state.progress=state.progress||{};state.activity=state.activity||[];state.favorites=state.favorites||[];state.settings=state.settings||{target:15,accent:'American'};state.sets.forEach(s=>(s.cards||[]).forEach(c=>{if(!c.id)c.id=id()}));localStorage.setItem(KEY,JSON.stringify(state))}else{let priorUser=localStorage.getItem('mpqz-last-sync-user');if(priorUser&&priorUser!==user.id)state={sets:[],folders:[],progress:{},activity:[],favorites:[],settings:{target:15,accent:'American'}};let{error:saveError}=await syncClient.from('personal_learning_data').upsert({user_id:user.id,payload:accountPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(saveError){syncStatus('Không lưu được dữ liệu: '+saveError.message);return false}}localStorage.setItem('mpqz-last-sync-user',user.id);let sharedReady=await refreshSharedDecks();syncReady=true;if(legacyReviewCleaned){legacyReviewCleaned=false;await syncCloudNow()}syncStatus(sharedReady?'Đã đồng bộ · '+user.email:'Đã đồng bộ riêng · cần chạy SQL mới để bật thư viện chung');render();return true}async function signInSync(){

async function signUpSync(){
  let modalOpen=!!document.getElementById('authEmail');
  try{
    const{email,password,confirmPassword}=syncCredentials();
    if(!email||password.length<8)throw Error('Nhập email và mật khẩu gồm ít nhất 8 ký tự.');
    if(password!==confirmPassword)throw Error('Mật khẩu nhập lại chưa khớp. Hãy kiểm tra lại.');
    syncClient=syncFormConfig();
    setAuthBusy(true,'Đang tạo tài khoản…');
    syncStatus('Đang tạo tài khoản…');
    authNotice('Đang tạo không gian học tập của bạn…','loading');
    const{data,error}=await syncClient.auth.signUp({email,password});
    if(error)throw error;
    if(data.session&&data.user){
      syncUser=data.user;
      if(!await loadCloudForUser(syncUser))throw Error('Không thể tải dữ liệu. Kiểm tra bảng và chính sách bảo vệ dữ liệu.');
      toast('Tài khoản đã tạo và dữ liệu được đồng bộ.');
      if(modalOpen)closeModal();
    }else{
      const message='Đã gửi email xác nhận. Xác nhận email rồi đăng nhập để bật đồng bộ.';
      syncStatus(message);
      authNotice(message,'success');
    }
  }catch(e){
    const message=e?.message||'Có lỗi xảy ra. Vui lòng thử lại.';
    syncStatus('Không tạo được tài khoản: '+message);
    authNotice(message,'error');
  }finally{setAuthBusy(false)}
}
async function signOutSync(){if(!syncClient)return;let{error}=await syncClient.auth.signOut();if(error){syncStatus('Không đăng xuất được: '+error.message);return}syncReady=false;syncUser=null;publishedDeckIds.clear();state.sets=(state.sets||[]).filter(s=>!s._shared&&!(s.title==='Ôn tập hôm nay'&&s.folder==='Review'));save();syncStatus('Đã đăng xuất. Dữ liệu cá nhân trên thiết bị vẫn được giữ lại.');render();toast('Đã đăng xuất.')}async function restoreSyncSession(){if(!syncConfig.url||!syncConfig.key)return;try{syncClient=initSyncClient();let{data,error}=await syncClient.auth.getSession();if(error)throw error;if(data.session){syncUser=data.session.user;await loadCloudForUser(syncUser)}}catch(e){syncStatus('Đồng bộ chưa sẵn sàng: '+e.message)}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setObj(sid){if(sid===REVIEW_SESSION_ID)return{id:REVIEW_SESSION_ID,title:'Ôn tập cách quãng',description:'',folder:'',cards:reviewQueue.map(item=>({...item.card,_reviewSourceSid:item.sid}))};return state.sets.find(s=>s.id===sid)}function progress(sid,cid){return state.progress[sid+':'+cid]||{correct:0,incorrect:0,status:'New',nextReview:null}}function toast(t){const r=document.getElementById('toastroot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',3800)}
