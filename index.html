const KEY='mpqz-v1';const today=()=>new Date().toISOString().slice(0,10);let state=load();let syncConfig=JSON.parse(localStorage.getItem('mpqz-sync-config')||'{}'),syncClient=null,syncUser=null,syncReady=false,syncTimer=null;let page='home',activeSet=null,cardIndex=0,flipped=false,session=null,matchState=null,flashSession=null,testConfig=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch{}return{sets:[{id:id(),title:'Từ vựng giao tiếp hằng ngày',description:'Những từ và cụm từ hữu ích trong hội thoại thường ngày.',folder:'General English',cards:[{term:'thoughtful',meaning:'chu đáo, ân cần',ipa:'/ˈθɔːt.fəl/',pos:'adjective',definition:'Showing consideration for the needs of other people.',example:'It was thoughtful of you to bring her a coffee.',translation:'Bạn thật chu đáo khi mang cà phê cho cô ấy.',synonyms:'considerate, kind'},{term:'to run into',meaning:'tình cờ gặp',ipa:'/rʌn ˈɪn.tuː/',pos:'phrasal verb',definition:'To meet someone unexpectedly.',example:'I ran into my old teacher at the market.',translation:'Tôi tình cờ gặp giáo viên cũ ở chợ.',synonyms:'bump into, come across'},{term:'reliable',meaning:'đáng tin cậy',ipa:'/rɪˈlaɪ.ə.bəl/',pos:'adjective',definition:'Able to be trusted or depended on.',example:'She is a reliable colleague.',translation:'Cô ấy là một đồng nghiệp đáng tin cậy.',synonyms:'dependable, trustworthy'},{term:'eventually',meaning:'cuối cùng, rốt cuộc',ipa:'/ɪˈven.tʃu.ə.li/',pos:'adverb',definition:'At the end of a process or period of time.',example:'After several attempts, he eventually succeeded.',translation:'Sau vài lần thử, cuối cùng anh ấy cũng thành công.',synonyms:'finally, in the end'},{term:'to figure out',meaning:'tìm ra, hiểu ra',ipa:'/ˈfɪɡ.ər aʊt/',pos:'phrasal verb',definition:'To understand or solve something.',example:'We need to figure out what went wrong.',translation:'Chúng ta cần tìm ra điều gì đã sai.',synonyms:'work out, solve'}]},{id:id(),title:'Academic English · B2',description:'Từ vựng hữu ích khi đọc và viết học thuật.',folder:'Academic English',cards:[{term:'significant',meaning:'đáng kể; quan trọng',ipa:'/sɪɡˈnɪf.ɪ.kənt/',pos:'adjective',definition:'Important or noticeable.',example:'The study found a significant difference.',translation:'Nghiên cứu tìm thấy một khác biệt đáng kể.'},{term:'to assess',meaning:'đánh giá',ipa:'/əˈses/',pos:'verb',definition:'To make a judgment about something.',example:'The course assesses students’ writing.',translation:'Khóa học đánh giá bài viết của sinh viên.'},{term:'evidence',meaning:'bằng chứng',ipa:'/ˈev.ɪ.dəns/',pos:'noun',definition:'Facts or information that show something is true.',example:'There is strong evidence for this claim.',translation:'Có bằng chứng vững chắc cho nhận định này.'}]}],folders:['General English','IELTS','Grammar','Academic English','Legal English','My Difficult Words'],progress:{},activity:[],favorites:[],settings:{target:15,accent:'American'}}}
function id(){return Math.random().toString(36).slice(2,10)}function save(){localStorage.setItem(KEY,JSON.stringify(state));if(syncReady&&syncUser)scheduleCloudSync()}function syncStatus(message){let el=document.getElementById('syncStatus');if(el)el.textContent=message}
function initSyncClient(){if(!syncConfig.url||!syncConfig.key){throw Error('Nhập Project URL và publishable / anon key trước.')}if(!window.supabase?.createClient){throw Error('Không tải được thư viện kết nối. Hãy kết nối Internet rồi tải lại trang.')}if(!syncClient)syncClient=window.supabase.createClient(syncConfig.url.trim(),syncConfig.key.trim());return syncClient}
function saveSyncConfig(){syncConfig={url:document.getElementById('syncUrl').value.trim(),key:document.getElementById('syncKey').value.trim()};localStorage.setItem('mpqz-sync-config',JSON.stringify(syncConfig));try{initSyncClient();toast('Đã lưu cấu hình kết nối trên thiết bị này.')}catch(e){syncStatus(e.message);toast(e.message)}}
function syncFormConfig(){let u=document.getElementById('syncUrl')?.value.trim(),k=document.getElementById('syncKey')?.value.trim();if(u&&k){syncConfig={url:u,key:k};localStorage.setItem('mpqz-sync-config',JSON.stringify(syncConfig))}return initSyncClient()}
function scheduleCloudSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncCloudNow,700)}
async function syncCloudNow(){if(!syncReady||!syncUser||!syncClient)return;let{error}=await syncClient.from('personal_learning_data').upsert({user_id:syncUser.id,payload:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){syncStatus('Chưa đồng bộ: '+error.message);return}syncStatus('Đã đồng bộ · '+syncUser.email)}
async function loadCloudForUser(user){syncReady=false;syncStatus('Đang tải dữ liệu riêng…');let{data,error}=await syncClient.from('personal_learning_data').select('payload').eq('user_id',user.id).maybeSingle();if(error){syncStatus('Không tải được dữ liệu: '+error.message);return false}if(data?.payload){localStorage.setItem(KEY+'-before-sync-'+user.id,JSON.stringify(state));state=data.payload;state.sets=Array.isArray(state.sets)?state.sets:[];state.folders=Array.isArray(state.folders)?state.folders:[];state.progress=state.progress||{};state.activity=state.activity||[];state.favorites=state.favorites||[];state.settings=state.settings||{target:15,accent:'American'};state.sets.forEach(s=>(s.cards||[]).forEach(c=>{if(!c.id)c.id=id()}));localStorage.setItem(KEY,JSON.stringify(state))}else{let{error:saveError}=await syncClient.from('personal_learning_data').upsert({user_id:user.id,payload:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(saveError){syncStatus('Không lưu được dữ liệu: '+saveError.message);return false}}syncReady=true;syncStatus('Đã đồng bộ · '+user.email);render();return true}
async function signInSync(){try{syncClient=syncFormConfig();let email=document.getElementById('syncEmail').value.trim(),password=document.getElementById('syncPassword').value;if(!email||!password)throw Error('Nhập email và mật khẩu để đăng nhập.');syncStatus('Đang đăng nhập…');let{data,error}=await syncClient.auth.signInWithPassword({email,password});if(error)throw error;syncUser=data.user;if(!await loadCloudForUser(syncUser))throw Error('Không thể tải dữ liệu. Kiểm tra bảng và chính sách bảo vệ dữ liệu.');toast('Đã đăng nhập và đồng bộ.')}catch(e){syncStatus('Lỗi kết nối: '+e.message)}}
async function signUpSync(){try{syncClient=syncFormConfig();let email=document.getElementById('syncEmail').value.trim(),password=document.getElementById('syncPassword').value;if(!email||password.length<8)throw Error('Nhập email và mật khẩu gồm ít nhất 8 ký tự.');syncStatus('Đang tạo tài khoản…');let{data,error}=await syncClient.auth.signUp({email,password});if(error)throw error;if(data.session&&data.user){syncUser=data.user;if(!await loadCloudForUser(syncUser))throw Error('Không thể tải dữ liệu. Kiểm tra bảng và chính sách bảo vệ dữ liệu.');toast('Tài khoản đã tạo và dữ liệu được đồng bộ.')}else syncStatus('Đã gửi email xác nhận. Xác nhận email rồi đăng nhập.')}catch(e){syncStatus('Không tạo được tài khoản: '+e.message)}}

async function restoreSyncSession(){if(!syncConfig.url||!syncConfig.key)return;try{syncClient=initSyncClient();let{data,error}=await syncClient.auth.getSession();if(error)throw error;if(data.session){syncUser=data.session.user;await loadCloudForUser(syncUser)}}catch(e){syncStatus('Đồng bộ chưa sẵn sàng: '+e.message)}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setObj(sid){return state.sets.find(s=>s.id===sid)}function progress(sid,cid){return state.progress[sid+':'+cid]||{correct:0,incorrect:0,status:'New',nextReview:null}}function toast(t){const r=document.getElementById('toastroot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',2400)}

ote">${syncUser?'Đang đăng nhập: '+esc(syncUser.email):'Chưa kết nối tài khoản.'}</p><p class="footnote">Chỉ dùng publishable / anon key ở đây. Không nhập service role key hoặc mật khẩu Supabase vào mã nguồn. Sau khi tạo tài khoản của bạn, hãy tắt đăng ký công khai trong cài đặt Supabase.</p></div><div class="panel"><h3>Dữ liệu cá nhân</h3><p class="footnote">Bản sao lưu JSON vẫn có thể dùng để xuất hoặc khôi phục dữ liệu.</p><div class="setactions"><button class="btn secondary small" onclick="exportData()">Xuất bản sao lưu</button><label class="btn secondary small">Nhập bản sao lưu<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div><button class="btn small" style="background:#b74352;margin-top:12px" onclick="clearData()">Xóa toàn bộ dữ liệu</button></div></div>`}
function studyLanding(p){let titles={flashcards:'Thẻ ghi nhớ',learn:'Luyện tập',test:'Kiểm tra',match:'Ghép từ'};return `<div id="studyArea"><div class="pagehead"><div><h1>${titles[p]}</h1><p class="sub">Chọn một bộ thẻ để bắt đầu phiên học.</p></div><button class="btn secondary" onclick="nav('library')">Mở thư viện</button></div><div class="setgrid">${state.sets.map(s=>`<div class="card setcard"><span class="chip">${esc(s.folder)}</span><h3>${esc(s.title)}</h3><p>${s.cards.length} thẻ · ${esc(s.description||'')}</p><button class="btn" style="width:100%" onclick="launch('${s.id}','${p}')">${p==='flashcards'?'Học thẻ':p==='learn'?'Bắt đầu luyện':p==='test'?'Bắt đầu kiểm tra':'Chơi ghép từ'} →</button></div>`).join('')||empty('Chưa có bộ thẻ','Tạo bộ thẻ để bắt đầu học.')}</div></div>`}
function empty(title,text){return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`}function bindPage(){if(page==='library'){document.getElementById('setSearch').oninput=drawSets;document.getElementById('folderFilter').onchange=drawSets;document.getElementById('sortSets').onchange=drawSets;document.getElementById('viewType').onchange=drawSets;drawSets()}}
function openStudySet(sid){activeSet=sid;nav('flashcards')}function launch(sid,mode){activeSet=sid;session=null;matchState=null;flashSession=mode==='flashcards'?{started:Date.now(),correct:0,seen:0}:null;cardIndex=0;flipped=false;page=mode;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===mode));if(mode==='test')testConfig={count:Math.min(20,setObj(sid).cards.length),format:'choice',ask:'term',answer:'meaning',reveal:true};render();if(mode==='learn')beginQuiz(mode);if(mode==='match')beginMatch()}
function safeImage(url){try{let u=new URL(url,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function drawTestSetup(){let root=document.getElementById('studyArea'),s=setObj(activeSet);if(!root||!s||!testConfig)return;root.innerHTML=`<div class="studywrap"><div class="studybar"><button class="btn ghost" onclick="activeSet=null;testConfig=null;render()">← Chọn bộ thẻ</button><span class="muted">${esc(s.title)}</span><span>${s.cards.length} từ</span></div><div class="quizbox"><div class="eyebrow">TÙY CHỈNH BÀI KIỂM TRA</div><h2>Thiết lập bài kiểm tra</h2><div class="settingsgrid"><div class="formgroup"><label>Số câu hỏi (1–20)</label><select id="testCount" class="field">${Array.from({length:20},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===testConfig.count?'selected':''}>${n} câu</option>`).join('')}</select></div><div class="formgroup"><label>Kiểu trả lời</label><select id="testFormat" class="field"><option value="choice" ${testConfig.format==='choice'?'selected':''}>Nhiều lựa chọn</option><option value="truefalse" ${testConfig.format==='truefalse'?'selected':''}>Đúng / Sai</option><option value="written" ${testConfig.format==='written'?'selected':''}>Tự luận</option></select></div><div class="formgroup"><label>Hỏi bằng</label><select id="testAsk" class="field"><option value="term" ${testConfig.ask==='term'?'selected':''}>Thuật ngữ tiếng Anh</option><option value="meaning" ${testConfig.ask==='meaning'?'selected':''}>Định nghĩa / nghĩa tiếng Việt</option></select></div><div class="formgroup"><label>Trả lời bằng</label><select id="testAnswer" class="field"><option value="meaning" ${testConfig.answer==='meaning'?'selected':''}>Định nghĩa / nghĩa tiếng Việt</option><option value="term" ${testConfig.answer==='term'?'selected':''}>Thuật ngữ tiếng Anh</option></select></div></div><label style="display:flex;gap:9px;align-items:center;margin:9px 0 15px;font-weight:600"><input type="checkbox" id="testReveal" ${testConfig.reveal?'checked':''}> Hiện đúng/sai và đáp án ngay sau mỗi câu</label><p class="footnote">Nếu chọn nhiều câu hơn số thẻ trong bộ, một số từ sẽ xuất hiện lặp lại. Câu trả lời đúng sẽ nâng dần mức độ thành thạo; câu sai được đưa vào ôn tập sớm.</p><button class="btn" onclick="beginTest()">Bắt đầu kiểm tra →</button></div></div>`}
function testPrompt(card,side){return side==='term'?`Thuật ngữ “${card.term}” có nghĩa nào?`:`Thuật ngữ tiếng Anh nào tương ứng với “${card.meaning}”?`}
function testAnswerValue(card,side){return side==='term'?card.term:card.meaning}
function beginTest(){let s=setObj(activeSet);if(!s||!s.cards.length)return;testConfig={count:Number(document.getElementById('testCount').value),format:document.getElementById('testFormat').value,ask:document.getElementById('testAsk').value,answer:document.getElementById('testAnswer').value,reveal:document.getElementById('testReveal').checked};let pool=[...s.cards].sort(()=>Math.random()-.5),questions=[];for(let i=0;i<testConfig.count;i++){let card=pool[i%pool.length],q={card,prompt:testPrompt(card,testConfig.ask),correctAnswer:testAnswerValue(card,testConfig.answer),isTrue:true};if(testConfig.format==='truefalse'){q.isTrue=Math.random()>=.5;if(!q.isTrue){let alternatives=s.cards.filter(c=>c.id!==card.id);q.statementAnswer=alternatives.length?testAnswerValue(alternatives[Math.floor(Math.random()*alternatives.length)],testConfig.answer):(testConfig.answer==='term'?'Một từ khác':'Một nghĩa khác');}else q.statementAnswer=q.correctAnswer;}questions.push(q)}session={mode:'test',questions,i:0,correct:0,answers:[],started:Date.now(),locked:false,reveal:testConfig.reveal};drawTestQuiz()}
function testOptions(q){let s=setObj(activeSet),correct=q.correctAnswer,accepted=testConfig.answer==='meaning'?correct.split(/[;,]/).map(normalize):[normalize(correct)],seen=new Set(accepted),candidates=[];for(let c of s.cards){let value=testAnswerValue(c,testConfig.answer);if(!value)continue;let key=normalize(value);if(seen.has(key))continue;seen.add(key);candidates.push(value.trim())}candidates.sort(()=>Math.random()-.5);let options=[correct,...candidates.slice(0,3)],filler=['Không thuộc bộ từ này','Từ còn lại','Không có đáp án phù hợp'];for(let f of filler){if(options.length>=4)break;if(!options.some(o=>normalize(o)===normalize(f)))options.push(f)}return options.sort(()=>Math.random()-.5)}
function drawTestQuiz(){let root=document.getElementById('studyArea');if(!root||!session)return;if(session.i>=session.questions.length){finishTest();return}let x=session,q=x.questions[x.i],format=testConfig.format;let prompt=format==='truefalse'?`“${testAnswerValue(q.card,testConfig.ask)}” tương ứng với “${q.statementAnswer}” — đúng hay sai?`:q.prompt;let answerUi=format==='truefalse'?`<div class="answers"><button class="answer" onclick="submitTestAnswer('Đúng')">Đúng</button><button class="answer" onclick="submitTestAnswer('Sai')">Sai</button></div>`:format==='choice'?`<div class="answers">${testOptions(q).map(o=>`<button class="answer" onclick="submitTestAnswer(this.textContent)">${esc(o)}</button>`).join('')}</div>`:`<input id="testTyped" class="inputanswer" placeholder="Nhập câu trả lời…" onkeydown="if(event.key==='Enter')submitTestAnswer(this.value)"><div style="margin-top:13px"><button class="btn" onclick="submitTestAnswer(document.getElementById('testTyped').value)">Gửi đáp án</button></div>`;root.innerHTML=`<div class="studywrap"><div class="studybar"><button class="btn ghost" onclick="quitSession()">← Thoát</button><span class="muted">${esc(setObj(activeSet)?.title||'')}</span><span>${x.i+1} / ${x.questions.length}</span></div><div class="progressline"><span style="width:${x.i/x.questions.length*100}%"></span></div><div class="quizbox"><div class="eyebrow">CÂU ${x.i+1} · ${format==='choice'?'NHIỀU LỰA CHỌN':format==='truefalse'?'ĐÚNG / SAI':'TỰ LUẬN'}</div><h2>${esc(prompt).replace(/\n/g,'<br>')}</h2>${answerUi}<div id="testFeedback" class="feedback"></div><div id="testNext" class="hidden" style="text-align:right"><button class="btn" onclick="nextTestQuestion()">${x.i+1===x.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button></div></div></div>`}
function explanationFor(card){let details=[];if(card.definition)details.push(card.definition);if(card.example)details.push(`Ví dụ: ${card.example}`);return details.length?details.join(' '):`“${card.term}” có nghĩa là “${card.meaning}”.`}
function masteryPercent(p){let n=Number(p?.correct)||0;return Math.max(0,Math.min(100,p?.status==='Needs review'?n*25-15:n*25))}
function masteryMarkup(p){let percent=masteryPercent(p);return `<div class="mastery-block"><div class="mastery-label"><span>Mức độ thành thạo</span><strong>${percent}% · ${esc(p?.status||'New')}</strong></div><div class="mastery-track"><div class="mastery-fill" style="width:${percent}%"></div></div></div>`}
function expectedTestAnswer(q){return testConfig.format==='truefalse'?(q.isTrue?'Đúng':'Sai'):q.correctAnswer}function submitTestAnswer(value){if(!session||session.locked)return;let q=session.questions[session.i],format=testConfig.format,correct=format==='truefalse'?(value===(q.isTrue?'Đúng':'Sai')):normalize(value)===normalize(q.correctAnswer)||testConfig.answer==='meaning'&&q.correctAnswer.split(/[;,]/).some(v=>normalize(value)===normalize(v));session.locked=true;if(format!=='written')document.querySelectorAll('.answer').forEach(b=>b.disabled=true);record(activeSet,q.card,correct);let p=progress(activeSet,q.card.id);session.correct+=correct?1:0;session.answers.push({card:q.card,correct,userAnswer:value,question:q,level:p.status,mastery:{...p}});let fb=document.getElementById('testFeedback');if(session.reveal){fb.innerHTML=correct?`<span style="color:var(--green)">✓ Chính xác!</span>${masteryMarkup(p)}`:`<span style="color:var(--red)">Chưa chính xác.</span><br>Đáp án đúng: <b>${esc(expectedTestAnswer(q))}</b>.<br>${esc(explanationFor(q.card))}<br><span class="smalltext">Thẻ này sẽ được ôn lại sớm hơn.</span>${masteryMarkup(p)}`}else fb.innerHTML=`<span class="muted">Đã ghi nhận. Đáp án và giải thích sẽ hiện ở trang kết quả.</span>${masteryMarkup(p)}`;document.getElementById('testNext').classList.remove('hidden')}
function nextTestQuestion(){if(!session)return;session.i++;session.locked=false;drawTestQuiz()}
function finishTest(){let s=session,mins=Math.max(1,Math.round((Date.now()-s.started)/60000));finishActivity(activeSet,s.correct,mins);let details=s.answers.map((a,i)=>`<div class="quickitem"><div class="quickicon" style="background:${a.correct?'#e7f8f0':'#fff0f0'};color:${a.correct?'#18744e':'#b74352'}">${a.correct?'✓':'×'}</div><div><strong>${i+1}. ${esc(a.card.term)} — ${esc(a.card.meaning)}</strong><small>${a.correct?'Đúng':'Bạn trả lời: '+esc(a.userAnswer||'—')+' · Đáp án: '+esc(expectedTestAnswer(a.question))}${!a.correct?' · '+esc(explanationFor(a.card)):''}</small><div>${masteryMarkup(a.mastery)}</div></div></div>`).join('');document.getElementById('studyArea').innerHTML=`<div class="studywrap"><div class="panel result"><div class="eyebrow">HOÀN THÀNH BÀI KIỂM TRA</div><div class="score">${s.correct}/${s.questions.length}</div><h2>${Math.round(s.correct/s.questions.length*100)}% chính xác</h2><p class="muted">${s.answers.filter(a=>!a.correct).length} câu cần xem lại · ${mins} phút</p><div class="setactions" style="justify-content:center"><button class="btn" onclick="session=null;launch('${activeSet}','test')">Làm bài khác</button><button class="btn secondary" onclick="session=null;nav('library')">Về thư viện</button></div></div><div class="sectionhead"><h2>Đáp án và mức độ thành thạo</h2></div><div class="quicklist">${details}</div></div>`;session=null}function drawFlash(){const s=setObj(activeSet);if(!s||!s.cards.length)return;const c=s.cards[cardIndex];const f=document.getElementById('studyArea');if(!f)return;let image=safeImage(c.image||'');f.innerHTML=`<div class="studywrap"><div class="studybar"><button class="btn ghost" onclick="nav('library')">← Thư viện</button><span class="muted">${esc(s.title)}</span><button class="btn ghost" onclick="shuffleCards()">⤨ Trộn</button></div><div class="progressline"><span style="width:${(cardIndex+1)/s.cards.length*100}%"></span></div><div style="display:flex;justify-content:space-between" class="smalltext"><span>${cardIndex+1} / ${s.cards.length}</span><button class="btn ghost small" onclick="starCard()">${state.favorites.includes(s.id+':'+c.id)?'★ Đã lưu':'☆ Lưu thẻ'}</button></div><div class="flashcard" onclick="flipCard()"><div>${flipped?`${image?`<img src="${esc(image)}" alt="Hình minh họa ${esc(c.term)}" style="max-width:min(100%,240px);max-height:125px;object-fit:contain;border-radius:8px;margin-bottom:12px" onerror="this.remove()">`:''}<div class="eyebrow">${esc(c.pos||'')}</div><div class="definition">${esc(c.meaning)}</div>${c.ipa?`<div class="detail">${esc(c.ipa)}</div>`:''}${c.definition?`<div class="detail">${esc(c.definition)}</div>`:''}${c.example?`<div class="detail"><i>${esc(c.example)}</i></div>`:''}${c.translation?`<div class="detail">${esc(c.translation)}</div>`:''}`:`<div class="term">${esc(c.term)}</div><div class="detail">${esc(c.ipa||'')}</div>`}</div><div class="flashhint">Nhấn để lật · Space</div></div><div class="flashcontrols"><button class="circlebtn" onclick="stepCard(-1)" aria-label="Thẻ trước">←</button><span class="smalltext">${flipped?'Mặt sau':'Mặt trước'}</span><button class="circlebtn" onclick="stepCard(1)" aria-label="Thẻ tiếp">→</button></div><div class="studytools"><button class="btn secondary" onclick="markCard(false)">Cần ôn lại</button><button class="btn secondary" onclick="markCard(true)">Đã nhớ ✓</button></div></div>`}
function flipCard(){flipped=!flipped;drawFlash()}function stepCard(d){const s=setObj(activeSet);cardIndex=(cardIndex+d+s.cards.length)%s.cards.length;flipped=false;drawFlash()}function shuffleCards(){const s=setObj(activeSet);s.cards.sort(()=>Math.random()-.5);cardIndex=0;drawFlash()}function starCard(){const k=activeSet+':'+setObj(activeSet).cards[cardIndex].id;state.favorites.includes(k)?state.favorites=state.favorites.filter(x=>x!==k):state.favorites.push(k);save();drawFlash()}function markCard(known){const s=setObj(activeSet),c=s.cards[cardIndex];record(activeSet,c,known);if(flashSession){flashSession.seen++;if(known)flashSession.correct++}let next=(cardIndex+1)%s.cards.length;if(next===0&&flashSession){finishActivity(activeSet,flashSession.correct,Math.max(1,Math.round((Date.now()-flashSession.started)/60000)));flashSession=null;toast('Đã hoàn thành một vòng thẻ.')}stepCard(1)}
function record(sid,c,known){let p=progress(sid,c.id),now=new Date();if(known){p.correct++;p.status=p.correct>=4?'Mastered':p.correct>=2?'Familiar':'Learning';let days=[1,3,7,14,30][Math.min(p.correct-1,4)];p.nextReview=new Date(now.getTime()+days*86400000).toISOString().slice(0,10)}else{p.incorrect++;p.status='Needs review';p.nextReview=new Date(now.getTime()+86400000).toISOString().slice(0,10)}p.lastReviewed=today();state.progress[sid+':'+c.id]=p;save()}
function chooseSet(mode){page=mode;render()}function dueCards(){let list=[];state.sets.forEach(s=>s.cards.forEach(c=>{let p=progress(s.id,c.id);if(p.nextReview&&p.nextReview<=today())list.push({sid:s.id,card:c})}));return list}function startReview(){let due=dueCards();if(!due.length){toast('Hiện chưa có thẻ đến hạn ôn. Hãy bắt đầu một bộ thẻ!');return}let s={id:id(),title:'Ôn tập hôm nay',description:'',folder:'Review',cards:due.map(x=>x.card.map?x.card:{...x.card})};state.sets.push(s);save();launch(s.id,'flashcards')}
function beginQuiz(mode){const s=setObj(activeSet);if(!s)return;session={mode,questions:[...s.cards].sort(()=>Math.random()-.5).slice(0,Math.min(10,s.cards.length)).map((c,i)=>({card:c,kind:mode==='test'?(i%3===0?'written':'choice'):(i%2===0?'choice':'written')})),i:0,correct:0,answers:[],started:Date.now(),locked:false};drawQuiz()}
function drawQuiz(){let root=document.getElementById('studyArea');if(!root||!session)return;let x=session;if(x.i>=x.questions.length){finishQuiz();return}let q=x.questions[x.i],c=q.card;root.innerHTML=`<div class="studywrap"><div class="studybar"><button class="btn ghost" onclick="quitSession()">← Thoát</button><span class="muted">${esc(setObj(activeSet)?.title||'Ôn tập')}</span><span>${x.i+1} / ${x.questions.length}</span></div><div class="progressline"><span style="width:${x.i/x.questions.length*100}%"></span></div><div class="quizbox"><div class="eyebrow">${q.kind==='written'?'VIẾT CÂU TRẢ LỜI':'TRẮC NGHIỆM'}</div><h2>${q.kind==='written'?`Viết nghĩa tiếng Việt của <b>${esc(c.term)}</b>`:`${esc(c.meaning)} nghĩa là gì?`}</h2>${q.kind==='written'?`<input id="typed" class="inputanswer" placeholder="Nhập đáp án…" onkeydown="if(event.key==='Enter')submitWritten()"><div style="margin-top:13px"><button class="btn" onclick="submitWritten()">Kiểm tra đáp án</button></div>`:`<div class="answers">${makeOptions(c).map(o=>`<button class="answer" onclick="answerChoice(this)">${esc(o)}</button>`).join('')}</div>`}<div id="feedback" class="feedback"></div><div id="nextwrap" class="hidden" style="text-align:right"><button class="btn" onclick="nextQuestion()">Tiếp theo →</button></div></div></div>`;if(q.kind==='written')document.getElementById('typed').focus()}
function makeOptions(card){let terms=[card.term,...setObj(activeSet).cards.filter(c=>c.id!==card.id).sort(()=>Math.random()-.5).slice(0,3).map(c=>c.term)];while(terms.length<4)terms.push(['reliable','thoughtful','eventually','evidence'][terms.length]);return terms.sort(()=>Math.random()-.5)}function normalize(s){return s.trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}function answerChoice(btn){if(!session||session.locked)return;let q=session.questions[session.i],correct=normalize(btn.textContent)===normalize(q.card.term);session.locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);btn.classList.add(correct?'correct':'wrong');if(!correct)document.querySelectorAll('.answer').forEach(b=>{if(normalize(b.textContent)===normalize(q.card.term))b.classList.add('correct')});showFeedback(correct,q.card)}function submitWritten(){if(session.locked)return;let q=session.questions[session.i],val=document.getElementById('typed').value;let correct=normalize(val)===normalize(q.card.meaning)||q.card.meaning.split(/[;,]/).some(a=>normalize(a)===normalize(val));session.locked=true;showFeedback(correct,q.card)}function showFeedback(correct,c){let q=session.questions[session.i];if(correct)session.correct++;session.answers.push({card:c,correct});record(activeSet,c,correct);document.getElementById('feedback').innerHTML=correct?'<span style="color:var(--green)">✓ Chính xác!</span>':`<span style="color:var(--red)">Chưa chính xác.</span> Đáp án: <b>${esc(q.card.term)} — ${esc(q.card.meaning)}</b>`;document.getElementById('nextwrap').classList.remove('hidden')}function nextQuestion(){session.i++;session.locked=false;drawQuiz()}function finishQuiz(){let s=session,mins=Math.max(1,Math.round((Date.now()-s.started)/60000));finishActivity(activeSet,s.correct,mins);document.getElementById('studyArea').innerHTML=`<div class="studywrap result panel"><div class="eyebrow">PHIÊN HOÀN THÀNH</div><div class="score">${s.correct}/${s.questions.length}</div><h2>${Math.round(s.correct/s.questions.length*100)}% chính xác</h2><p class="muted">${s.answers.filter(a=>!a.correct).length} thẻ được đánh dấu để ôn lại.</p><div class="setactions" style="justify-content:center"><button class="btn" onclick="session=null;beginQuiz('${s.mode}')">Làm lại</button><button class="btn secondary" onclick="session=null;nav('library')">Về thư viện</button></div></div>`;session=null}function finishActivity(sid,correct,minutes){state.activity.push({date:today(),sid,correct,minutes});let s=setObj(sid);if(s)s.lastStudied=today();save()}function quitSession(){session=null;nav('library')}
function beginMatch(){let s=setObj(activeSet);if(!s)return;let cards=[...s.cards].sort(()=>Math.random()-.5).slice(0,Math.min(6,s.cards.length));matchState={cards,tiles:cards.flatMap(c=>[{id:c.id,type:'term',text:c.term},{id:c.id,type:'meaning',text:c.meaning}]).sort(()=>Math.random()-.5),selected:null,done:[],start:Date.now(),errors:0};drawMatch()}function drawMatch(){let root=document.getElementById('studyArea');if(!root||!matchState)return;let m=matchState;root.innerHTML=`<div class="studywrap"><div class="studybar"><button class="btn ghost" onclick="nav('library')">← Thư viện</button><span>Đã ghép ${m.done.length/2} / ${m.cards.length} cặp</span><b>${Math.floor((Date.now()-m.start)/1000)} giây</b></div><div class="panel"><h2 style="font:800 20px 'Plus Jakarta Sans';margin:0 0 15px">Chọn từ và nghĩa tương ứng</h2><div class="matchgrid">${m.tiles.map((t,i)=>`<button class="matchtile ${m.selected===i?'selected':''} ${m.done.includes(t.id+':'+t.type)?'done':''}" onclick="pickMatch(${i})">${esc(t.text)}</button>`).join('')}</div><div id="matchmsg" class="feedback"></div></div><div style="margin-top:13px;text-align:center"><button class="btn secondary" onclick="launch('${activeSet}','match')">↻ Chơi lại</button></div></div>`}function pickMatch(i){let m=matchState,t=m.tiles[i];if(m.done.includes(t.id+':'+t.type))return;if(m.selected===null){m.selected=i;drawMatch();return}let a=m.tiles[m.selected];if(a.id===t.id&&a.type!==t.type){m.done.push(a.id+':'+a.type,t.id+':'+t.type);m.selected=null;if(m.done.length===m.tiles.length){let seconds=Math.floor((Date.now()-m.start)/1000);state.matchRecords=state.matchRecords||[];state.matchRecords.push({sid:activeSet,seconds,date:today()});save();setTimeout(()=>document.getElementById('studyArea').innerHTML=`<div class="studywrap result panel"><div class="score">${seconds}s</div><h2>Hoàn thành! 🎉</h2><p class="muted">Bạn đã ghép đúng tất cả ${m.cards.length} cặp.</p><button class="btn" onclick="launch('${activeSet}','match')">Chơi lại</button></div>`,300)}else drawMatch()}else{m.errors++;m.selected=null;drawMatch();setTimeout(()=>{let msg=document.getElementById('matchmsg');if(msg)msg.textContent='Chưa khớp. Thử lại nhé!'},20)}}
function openEditor(sid){const s=sid?setObj(sid):{title:'',description:'',folder:state.folders[0]||'',cards:[{term:'',meaning:''}]};let editing=!!sid;document.getElementById('modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${editing?'Chỉnh sửa bộ thẻ':'Tạo bộ thẻ mới'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><div class="formgroup"><label>Tên bộ thẻ *</label><input id="editTitle" value="${esc(s.title)}" placeholder="Ví dụ: Từ vựng IELTS B2"></div><div class="formgroup"><label>Thư mục</label><select id="editFolder">${state.folders.map(f=>`<option ${f===s.folder?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div><div class="formgroup"><label>Mô tả</label><input id="editDescription" value="${esc(s.description||'')}" placeholder="Bộ thẻ này giúp bạn học…"></div><div class="sectionhead"><h2 style="font-size:15px">Thẻ từ vựng</h2><button class="btn secondary small" onclick="addEditCard()">＋ Thêm thẻ</button></div><div id="cardsEditor" class="cards-editor">${s.cards.map(c=>cardEditor(c)).join('')}</div><div class="toolbar"><button class="btn secondary small" onclick="pasteImport()">Dán danh sách từ</button><span class="smalltext">Mỗi dòng: English | /IPA/ | nghĩa tiếng Việt | ví dụ | URL hình ảnh (tùy chọn)</span></div><div style="display:flex;justify-content:flex-end;gap:9px"><button class="btn secondary" onclick="closeModal()">Hủy</button><button class="btn" onclick="saveSet('${sid||''}')">Lưu bộ thẻ</button></div></div></div>`}
function cardEditor(c={}){return `<div class="editcard"><div><input class="term-input" placeholder="English" value="${esc(c.term||'')}"><textarea class="detail-input" placeholder="Nghĩa tiếng Việt">${esc(c.meaning||'')}</textarea></div><div><input placeholder="/IPA/ (tùy chọn)" class="ipa-input" value="${esc(c.ipa||'')}"><textarea class="example-input" placeholder="Ví dụ tiếng Anh (tùy chọn)">${esc(c.example||'')}</textarea><input placeholder="URL hình ảnh (tùy chọn)" class="image-input" value="${esc(c.image||'')}"></div><button class="dots" onclick="this.closest('.editcard').remove()">×</button></div>`}function addEditCard(){document.getElementById('cardsEditor').insertAdjacentHTML('beforeend',cardEditor())}
function pasteImport(){let t=prompt('Mỗi dòng theo dạng:\nEnglish | /IPA/ | nghĩa tiếng Việt | ví dụ | URL hình ảnh (tùy chọn)\n\nCó thể bỏ trống ví dụ hoặc hình ảnh nhưng vẫn giữ dấu |.');if(!t)return;let valid=[],invalid=[];t.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;let p=line.split('|').map(x=>x.trim());if(p.length<3||!p[0]||!p[2]){invalid.push(i+1);return}valid.push({term:p[0],ipa:p[1],meaning:p[2],example:p[3]||'',image:p.slice(4).join('|').trim()})});if(!valid.length){toast(`Không có dòng hợp lệ. Cần ít nhất English | IPA | nghĩa tiếng Việt. Dòng lỗi: ${invalid.join(', ')||'—'}`);return}let message=`Tìm thấy ${valid.length} dòng hợp lệ.${invalid.length?` Bỏ qua dòng lỗi: ${invalid.join(', ')}.`:''}\nThêm các thẻ này vào bộ thẻ?`;if(!confirm(message))return;valid.forEach(c=>document.getElementById('cardsEditor').insertAdjacentHTML('beforeend',cardEditor(c)));toast(`Đã thêm ${valid.length} thẻ vào trình soạn thảo. Nhấn “Lưu bộ thẻ” để lưu.`)}function closeModal(){document.getElementById('modalroot').innerHTML=''}function saveSet(sid){let title=document.getElementById('editTitle').value.trim(),existing=sid?setObj(sid).cards:[],cards=[...document.querySelectorAll('.editcard')].map(r=>{let term=r.querySelector('.term-input').value.trim();let prior=existing.find(c=>c.term.toLowerCase()===term.toLowerCase());return{id:prior?.id||id(),term,meaning:r.querySelector('.detail-input').value.trim(),ipa:r.querySelector('.ipa-input').value.trim(),definition:prior?.definition||'',example:r.querySelector('.example-input').value.trim(),image:r.querySelector('.image-input').value.trim()}}).filter(c=>c.term&&c.meaning);if(!title||!cards.length){toast('Vui lòng nhập tên bộ thẻ và ít nhất một thẻ có đủ từ, nghĩa.');return}let obj=sid?setObj(sid):{id:id(),created:today()};Object.assign(obj,{title,description:document.getElementById('editDescription').value.trim(),folder:document.getElementById('editFolder').value,cards});if(!sid)state.sets.unshift(obj);save();closeModal();render();toast('Đã lưu bộ thẻ.')}
function setMenu(sid){let s=setObj(sid),choice=prompt(`Bộ thẻ: ${s.title}\nNhập: 1 sửa · 2 nhân bản · 3 xóa`);if(choice==='1')openEditor(sid);if(choice==='2'){let copy=JSON.parse(JSON.stringify(s));copy.id=id();copy.title+=' (bản sao)';copy.created=today();copy.cards.forEach(c=>c.id=id());state.sets.unshift(copy);save();render();toast('Đã nhân bản bộ thẻ.')}if(choice==='3'&&confirm('Xóa bộ thẻ này và tiến độ liên quan?')){state.sets=state.sets.filter(x=>x.id!==sid);Object.keys(state.progress).filter(k=>k.startsWith(sid+':')).forEach(k=>delete state.progress[k]);save();render()}}function addFolder(){let f=prompt('Tên thư mục mới:');if(f?.trim()&&!state.folders.includes(f.trim())){state.folders.push(f.trim());save();render()}}
function hardWords(){let out=[];state.sets.forEach(s=>s.cards.forEach(c=>{let p=progress(s.id,c.id);if(p.incorrect)out.push({card:c,p})}));return out.sort((a,b)=>b.p.incorrect-a.p.incorrect)}function saveSettings(){state.settings.target=Number(document.getElementById('target').value)||15;state.settings.accent=document.getElementById('accent').value;save();toast('Đã lưu cài đặt.')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-personal-quizlet-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.sets)||!Array.isArray(data.folders))throw Error();if(confirm('Nhập bản sao lưu sẽ thay thế dữ liệu hiện tại. Tiếp tục?')){state=data;save();render();toast('Đã nhập dữ liệu.')}}catch{toast('Tệp sao lưu không hợp lệ.')}};reader.readAsText(file)}function clearData(){if(confirm('Xóa vĩnh viễn tất cả bộ thẻ và lịch sử trên thiết bị này?')){localStorage.removeItem(KEY);state=load();render();toast('Đã xóa dữ liệu.')}}function exportCsv(sid){let s=setObj(sid),rows=[['English','Vietnamese','IPA','Definition'],...s.cards.map(c=>[c.term,c.meaning,c.ipa||'',c.definition||''])],csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=s.title+'.csv';a.click()}
state.sets.forEach(s=>s.cards.forEach(c=>{if(!c.id)c.id=id()}));save();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')){if(e.key==='Escape')closeModal();return}if(page==='flashcards'&&activeSet){if(e.code==='Space'){e.preventDefault();flipCard()}if(e.key==='ArrowRight')stepCard(1);if(e.key==='ArrowLeft')stepCard(-1)}if(e.key==='Escape')closeModal()});function boot(){render();restoreSyncSession()}boot();
</script><script>if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}</script></body></html>
