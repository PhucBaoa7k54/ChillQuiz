function settingsPage(){return `<div class="pagehead"><div><h1>Cài đặt</h1><p class="sub">Tùy chỉnh trải nghiệm học tập cá nhân.</p></div></div><div class="settingsgrid"><div class="panel"><h2>Thói quen học</h2><div class="formgroup"><label>Mục tiêu học mỗi ngày (phút)</label><input id="target" class="field" type="number" min="1" value="${state.settings.target||15}"></div><div class="formgroup"><label>Phát âm mặc định</label><select id="accent" class="field"><option ${state.settings.accent==='American'?'selected':''}>American</option><option ${state.settings.accent==='British'?'selected':''}>British</option></select></div><button type="button" class="btn small" onclick="saveSettings()">Lưu cài đặt</button></div><div class="panel"><h2>Tài khoản & đồng bộ</h2><p class="footnote">Kết nối đã được cài sẵn. Đăng nhập cùng một tài khoản trên máy tính và điện thoại để đồng bộ bộ thẻ riêng và tiến độ.</p><div class="formgroup"><label>Email</label><input id="syncEmail" class="field" type="email" autocomplete="username" placeholder="you@example.com"></div><div class="formgroup"><label>Mật khẩu</label><input id="syncPassword" class="field" type="password" autocomplete="current-password" placeholder="Mật khẩu tài khoản"></div><div class="setactions"><button type="button" class="btn small" onclick="signInSync()">Đăng nhập</button><button type="button" class="btn secondary small" onclick="signUpSync()">Tạo tài khoản</button><button type="button" class="btn ghost small" onclick="signOutSync()">Đăng xuất</button></div><p id="syncStatus" class="footnote">${esc(syncMessage)}</p><p class="footnote">Bạn có thể chia sẻ riêng từng bộ thẻ từ thư viện. Các tài khoản khác chỉ xem được bộ đã chia sẻ.</p></div><div class="panel"><h2>Dữ liệu cá nhân</h2><p class="footnote">Bản sao lưu JSON vẫn có thể dùng để xuất hoặc khôi phục dữ liệu.</p><div class="setactions"><button type="button" class="btn secondary small" onclick="exportData()">Xuất bản sao lưu</button><label class="btn secondary small">Nhập bản sao lưu<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div><button type="button" class="btn small" style="background:var(--color-danger);margin-top:12px" onclick="clearData()">Xóa toàn bộ dữ liệu</button></div></div>`}function studyLanding(p){let titles={flashcards:'Thẻ ghi nhớ',learn:'Luyện tập',test:'Kiểm tra',match:'Ghép từ'};return `<div id="studyArea"><div class="pagehead"><div><h1>${titles[p]}</h1><p class="sub">Chọn một bộ thẻ để bắt đầu phiên học.</p></div><button type="button" class="btn secondary" onclick="nav('library')">Mở thư viện</button></div><div class="setgrid">${state.sets.map(s=>`<div class="card setcard"><span class="chip">${s._shared?'Thư viện chung':esc(s.folder||'Chưa phân loại')}</span><h2>${esc(s.title)}</h2><p>${s.cards.length} thẻ. ${esc(s.description||'')}</p><button type="button" class="btn" style="width:100%" onclick="launch('${s.id}','${p}')">${p==='flashcards'?'Học thẻ':p==='learn'?'Bắt đầu luyện':p==='test'?'Bắt đầu kiểm tra':'Chơi ghép từ'}</button></div>`).join('')||empty('Chưa có bộ thẻ','Tạo bộ thẻ để bắt đầu học.')}</div></div>`}function empty(title,text){return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`}function bindPage(){if(page==='library'){document.getElementById('setSearch').oninput=drawSets;document.getElementById('folderFilter').onchange=drawSets;document.getElementById('sortSets').onchange=drawSets;document.getElementById('viewType').onchange=drawSets;drawSets()}}
function openStudySet(sid){activeSet=sid;nav('flashcards')}function launch(sid,mode){activeSet=sid;session=null;matchState=null;flashSession=mode==='flashcards'?{started:Date.now(),correct:0,seen:0}:null;cardIndex=0;flipped=false;page=mode;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===mode));if(mode==='test')testConfig={count:Math.min(20,setObj(sid).cards.length),format:'choice',ask:'term',answer:'meaning',reveal:true};render();if(mode==='learn')beginQuiz(mode);if(mode==='match')beginMatch()}
function safeImage(url){try{let u=new URL(url,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function drawTestSetup(){let root=document.getElementById('studyArea'),s=setObj(activeSet);if(!root||!s||!testConfig)return;root.innerHTML=`<div class="studywrap"><div class="studybar"><button type="button" class="btn ghost" onclick="activeSet=null;testConfig=null;render()">← Chọn bộ thẻ</button><span class="muted">${esc(s.title)}</span><span>${s.cards.length} từ</span></div><div class="quizbox"><div class="smalltext">Thiết lập bài kiểm tra</div><h2>Thiết lập bài kiểm tra</h2><div class="settingsgrid"><div class="formgroup"><label>Số câu hỏi (1–20)</label><select id="testCount" class="field">${Array.from({length:20},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===testConfig.count?'selected':''}>${n} câu</option>`).join('')}</select></div><div class="formgroup"><label>Kiểu trả lời</label><select id="testFormat" class="field"><option value="choice" ${testConfig.format==='choice'?'selected':''}>Nhiều lựa chọn</option><option value="truefalse" ${testConfig.format==='truefalse'?'selected':''}>Đúng / Sai</option><option value="written" ${testConfig.format==='written'?'selected':''}>Tự luận</option></select></div><div class="formgroup"><label>Hỏi bằng</label><select id="testAsk" class="field"><option value="term" ${testConfig.ask==='term'?'selected':''}>Thuật ngữ tiếng Anh</option><option value="meaning" ${testConfig.ask==='meaning'?'selected':''}>Định nghĩa / nghĩa tiếng Việt</option></select></div><div class="formgroup"><label>Trả lời bằng</label><select id="testAnswer" class="field"><option value="meaning" ${testConfig.answer==='meaning'?'selected':''}>Định nghĩa / nghĩa tiếng Việt</option><option value="term" ${testConfig.answer==='term'?'selected':''}>Thuật ngữ tiếng Anh</option></select></div></div><label style="display:flex;gap:9px;align-items:center;margin:9px 0 15px;font-weight:600"><input type="checkbox" id="testReveal" ${testConfig.reveal?'checked':''}> Hiện đúng/sai và đáp án ngay sau mỗi câu</label><p class="footnote">Nếu chọn nhiều câu hơn số thẻ trong bộ, một số từ sẽ xuất hiện lặp lại. Câu trả lời đúng sẽ nâng dần mức độ thành thạo; câu sai được đưa vào ôn tập sớm.</p><button type="button" class="btn" onclick="beginTest()">Bắt đầu kiểm tra</button></div></div>`}
function testPrompt(card,side){return side==='term'?`Thuật ngữ “${card.term}” có nghĩa nào?`:`Thuật ngữ tiếng Anh nào tương ứng với “${card.meaning}”?`}
function testAnswerValue(card,side){return side==='term'?card.term:card.meaning}
function beginTest(){let s=setObj(activeSet);if(!s||!s.cards.length)return;testConfig={count:Number(document.getElementById('testCount').value),format:document.getElementById('testFormat').value,ask:document.getElementById('testAsk').value,answer:document.getElementById('testAnswer').value,reveal:document.getElementById('testReveal').checked};let pool=[...s.cards].sort(()=>Math.random()-.5),questions=[];for(let i=0;i<testConfig.count;i++){let card=pool[i%pool.length],q={card,prompt:testPrompt(card,testConfig.ask),correctAnswer:testAnswerValue(card,testConfig.answer),isTrue:true};if(testConfig.format==='truefalse'){q.isTrue=Math.random()>=.5;if(!q.isTrue){let alternatives=s.cards.filter(c=>c.id!==card.id);q.statementAnswer=alternatives.length?testAnswerValue(alternatives[Math.floor(Math.random()*alternatives.length)],testConfig.answer):(testConfig.answer==='term'?'Một từ khác':'Một nghĩa khác');}else q.statementAnswer=q.correctAnswer;}questions.push(q)}session={mode:'test',questions,i:0,correct:0,answers:[],started:Date.now(),locked:false,reveal:testConfig.reveal};drawTestQuiz()}
function testOptions(q){let s=setObj(activeSet),correct=q.correctAnswer,accepted=testConfig.answer==='meaning'?correct.split(/[;,]/).map(normalize):[normalize(correct)],seen=new Set(accepted),candidates=[];for(let c of s.cards){let value=testAnswerValue(c,testConfig.answer);if(!value)continue;let key=normalize(value);if(seen.has(key))continue;seen.add(key);candidates.push(value.trim())}candidates.sort(()=>Math.random()-.5);let options=[correct,...candidates.slice(0,3)],filler=['Không thuộc bộ từ này','Từ còn lại','Không có đáp án phù hợp'];for(let f of filler){if(options.length>=4)break;if(!options.some(o=>normalize(o)===normalize(f)))options.push(f)}return options.sort(()=>Math.random()-.5)}
function drawTestQuiz(){let root=document.getElementById('studyArea');if(!root||!session)return;if(session.i>=session.questions.length){finishTest();return}let x=session,q=x.questions[x.i],format=testConfig.format;let prompt=format==='truefalse'?`“${testAnswerValue(q.card,testConfig.ask)}” tương ứng với “${q.statementAnswer}” — đúng hay sai?`:q.prompt;let answerUi=format==='truefalse'?`<div class="answers"><button type="button" class="answer" onclick="submitTestAnswer('Đúng')">Đúng</button><button type="button" class="answer" onclick="submitTestAnswer('Sai')">Sai</button></div>`:format==='choice'?`<div class="answers">${testOptions(q).map(o=>`<button type="button" class="answer" onclick="submitTestAnswer(this.textContent)">${esc(o)}</button>`).join('')}</div>`:`<input id="testTyped" class="inputanswer" placeholder="Nhập câu trả lời…" onkeydown="if(event.key==='Enter')submitTestAnswer(this.value)"><div style="margin-top:13px"><button type="button" class="btn" onclick="submitTestAnswer(document.getElementById('testTyped').value)">Gửi đáp án</button></div>`;root.innerHTML=`<div class="studywrap"><div class="studybar"><button type="button" class="btn ghost" onclick="quitSession()">← Thoát</button><span class="muted">${esc(setObj(activeSet)?.title||'')}</span><span>${x.i+1} / ${x.questions.length}</span></div><div class="progressline"><span style="width:${x.i/x.questions.length*100}%"></span></div><div class="quizbox"><div class="smalltext">Câu ${x.i+1}: ${format==='choice'?'Nhiều lựa chọn':format==='truefalse'?'Đúng / sai':'TỰ LUẬN'}</div><h2>${esc(prompt).replace(/\n/g,'<br>')}</h2>${answerUi}<div id="testFeedback" class="feedback"></div><div id="testNext" class="hidden" style="text-align:right"><button type="button" class="btn" onclick="nextTestQuestion()">${x.i+1===x.questions.length?'Xem kết quả':'Câu tiếp theo'}</button></div></div></div>`}
function explanationFor(card){let details=[];if(card.definition)details.push(card.definition);if(card.example)details.push(`Ví dụ: ${card.example}`);return details.length?details.join(' '):`“${card.term}” có nghĩa là “${card.meaning}”.`}
function masteryPercent(p){let n=Number(p?.correct)||0;return Math.max(0,Math.min(100,p?.status==='Needs review'?n*25-15:n*25))}
function masteryMarkup(p){let percent=masteryPercent(p);return `<div class="mastery-block"><div class="mastery-label"><span>Mức độ thành thạo</span><strong>${percent}% · ${esc(p?.status||'New')}</strong></div><div class="mastery-track"><div class="mastery-fill" style="width:${percent}%"></div></div></div>`}
function expectedTestAnswer(q){return testConfig.format==='truefalse'?(q.isTrue?'Đúng':'Sai'):q.correctAnswer}function submitTestAnswer(value){if(!session||session.locked)return;let q=session.questions[session.i],format=testConfig.format,correct=format==='truefalse'?(value===(q.isTrue?'Đúng':'Sai')):normalize(value)===normalize(q.correctAnswer)||testConfig.answer==='meaning'&&q.correctAnswer.split(/[;,]/).some(v=>normalize(value)===normalize(v));session.locked=true;if(format!=='written')document.querySelectorAll('.answer').forEach(b=>b.disabled=true);record(activeSet,q.card,correct);let p=progress(activeSet,q.card.id);session.correct+=correct?1:0;session.answers.push({card:q.card,correct,userAnswer:value,question:q,level:p.status,mastery:{...p}});let fb=document.getElementById('testFeedback');if(session.reveal){fb.innerHTML=correct?`<span style="color:var(--green)">✓ Chính xác!</span>${masteryMarkup(p)}`:`<span style="color:var(--red)">Chưa chính xác.</span><br>Đáp án đúng: <b>${esc(expectedTestAnswer(q))}</b>.<br>${esc(explanationFor(q.card))}<br><span class="smalltext">Thẻ này sẽ được ôn lại sớm hơn.</span>${masteryMarkup(p)}`}else fb.innerHTML=`<span class="muted">Đã ghi nhận. Đáp án và giải thích sẽ hiện ở trang kết quả.</span>${masteryMarkup(p)}`;document.getElementById('testNext').classList.remove('hidden')}
function nextTestQuestion(){if(!session)return;session.i++;session.locked=false;drawTestQuiz()}
function finishTest(){let s=session,mins=Math.max(1,Math.round((Date.now()-s.started)/60000));finishActivity(activeSet,s.correct,mins);let details=s.answers.map((a,i)=>`<div class="quickitem"><div class="quickicon" style="background:${a.correct?'var(--color-success-soft)':'var(--color-error-soft)'};color:${a.correct?'var(--color-success)':'var(--color-error)'}">${a.correct?'✓':'×'}</div><div><strong>${i+1}. ${esc(a.card.term)} — ${esc(a.card.meaning)}</strong><small>${a.correct?'Đúng':'Bạn trả lời: '+esc(a.userAnswer||'—')+', đáp án: '+esc(expectedTestAnswer(a.question))}${!a.correct?' · '+esc(explanationFor(a.card)):''}</small><div>${masteryMarkup(a.mastery)}</div></div></div>`).join('');document.getElementById('studyArea').innerHTML=`<div class="studywrap"><div class="panel result"><div class="smalltext">Đã hoàn thành bài kiểm tra</div><div class="score">${s.correct}/${s.questions.length}</div><h2>${Math.round(s.correct/s.questions.length*100)}% chính xác</h2><p class="muted">${s.answers.filter(a=>!a.correct).length} câu cần xem lại, ${mins} phút</p><div class="setactions" style="justify-content:center"><button type="button" class="btn" onclick="session=null;launch('${activeSet}','test')">Làm bài khác</button><button type="button" class="btn secondary" onclick="session=null;nav('library')">Về thư viện</button></div></div><div class="sectionhead"><h2>Đáp án và mức độ thành thạo</h2></div><div class="quicklist">${details}</div></div>`;session=null}function drawFlash(){const s=setObj(activeSet);if(!s||!s.cards.length)return;const c=s.cards[cardIndex];const f=document.getElementById('studyArea');if(!f)return;let image=safeImage(c.image||'');f.innerHTML=`<div class="studywrap"><div class="studybar"><button type="button" class="btn ghost" onclick="nav('library')">← Thư viện</button><span class="muted">${esc(s.title)}</span><button type="button" class="btn ghost" onclick="shuffleCards()">⤨ Trộn</button></div><div class="progressline"><span style="width:${(cardIndex+1)/s. function flipCard(){flipped=!flipped;drawFlash()}function stepCard(d){const s=setObj(activeSet);cardIndex=(cardIndex+d+s.cards.length)%s.cards.length;flipped=false;drawFlash()}function shuffleCards(){const s=setObj(activeSet);s.cards.sort(()=>Math.random()-.5);cardIndex=0;drawFlash()}function starCard(){const k=activeSet+':'+setObj(activeSet).cards[cardIndex].id;state.favorites.includes(k)?state.favorites=state.favorites.filter(x=>x!==k):state.favorites.push(k);save();drawFlash()}function markCard(known){const s=setObj(activeSet),c=s.cards[cardIndex];record(activeSet,c,known);if(flashSession){flashSession.seen++;if(known)flashSession.correct++}let next=(cardIndex+1)%s.cards.length;if(next===0&&flashSession){finishActivity(activeSet,flashSession.correct,Math.max(1,Math.round((Date.now()-flashSession.started)/60000)));flashSession=null;toast('Đã hoàn thành một vòng thẻ.')}stepCard(1)}

function drawQuiz(){let root=document.getElementById('studyArea');if(!root||!session)return;let x=session;if(x.i>=x.questions.length){finishQuiz();return}let q=x.questions[x.i],c=q.card;root.innerHTML=`<div class="studywrap"><div class="studybar"><button type="button" class="btn ghost" onclick="quitSession()">← Thoát</button><span class="muted">${esc(setObj(activeSet)?.title||'Ôn tập')}</span><span>${x.i+1} / ${x.questions.length}</span></div><div class="progressline"><span style="width:${x.i/x.questions.length*100}%"></span></div><div class="quizbox"><div class="smalltext">${q.kind==='written'?'Tự luận':'Nhiều lựa chọn'}</div><h2>${q.kind==='written'?`Viết nghĩa tiếng Việt của <b>${esc(c.term)}</b>`:`${esc(c.meaning)} nghĩa là gì?`}</h2>${q.kind==='written'?`<input id="typed" class="inputanswer" placeholder="Nhập đáp án…" onkeydown="if(event.key==='Enter')submitWritten()"><div style="margin-top:13px"><button type="button" class="btn" onclick="submitWritten()">Kiểm tra đáp án</button></div>`:`<div class="answers">${makeOptions(c).map(o=>`<button type="button" class="answer" onclick="answerChoice(this)">${esc(o)}</button>`).join('')}</div>`}<div id="feedback" class="feedback"></div><div id="nextwrap" class="hidden" style="text-align:right"><button type="button" class="btn" onclick="nextQuestion()">Tiếp theo →</button></div></div></div>`;if(q.kind==='written')document.getElementById('typed').focus()}
function makeOptions(card){let terms=[card.term,...setObj(activeSet).cards.filter(c=>c.id!==card.id).sort(()=>Math.random()-.5).slice(0,3).map(c=>c.term)];while(terms.length<4)terms.push(['reliable','thoughtful','eventually','evidence'][terms.length]);return terms.sort(()=>Math.random()-.5)}function normalize(s){return s.trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}function answerChoice(btn){if(!session||session.locked)return;let q=session.questions[session.i],correct=normalize(btn.textContent)===normalize(q.card.term);session.locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);btn.classList.add(correct?'correct':'wrong');if(!correct)document.querySelectorAll('.answer').forEach(b=>{if(normalize(b.textContent)===normalize(q.card.term))b.classList.add('correct')});showFeedback(correct,q.card)}function submitWritten(){if(session.locked)return;let q=session.questions[session.i],val=document.getElementById('typed').value;let correct=normalize(val)===normalize(q.card.meaning)||q.card.meaning.split(/[;,]/).some(a=>normalize(a)===normalize(val));session.locked=true;showFeedback(correct,q.card)}function showFeedback(correct,c){let q=session.questions[session.i];if(correct)session.correct++;session.answers.push({card:c,correct});record(activeSet,c,correct);document.getElementById('feedback').innerHTML=correct?'<span style="color:var(--green)">✓ Chính xác!</span>':`<span style="color:var(--red)">Chưa chính xác.</span> Đáp án: <b>${esc(q.card.term)} — ${esc(q.card.meaning)}</b>`;document.getElementById('nextwrap').classList.remove('hidden')}function nextQuestion(){session.i++;session.locked=false;drawQuiz()}function finishQuiz(){let s=session,mins=Math.max(1,Math.round((Date.now()-s.started)/60000));finishActivity(activeSet,s.correct,mins);document.getElementById('studyArea').innerHTML=`<div class="studywrap result panel"><div class="result-kicker">Đã hoàn thành buổi học</div><div class="score">${s.correct}/${s.questions.length}</div function beginMatch(){let s=setObj(activeSet);if(!s)return;let cards=[...s.cards].sort(()=>Math.random()-.5).slice(0,Math.min(6,s.cards.length));matchState={cards,tiles:cards.flatMap(c=>[{id:c.id,type:'term',text:c.term},{id:c.id,type:'meaning',text:c.meaning}]).sort(()=>Math.random()-.5),selected:null,done:[],start:Date.now(),errors:0};drawMatch()}function drawMatch(){let root=document.getElementById('studyArea');if(!root||!matchState)return;let m=matchState;root.innerHTML=`<div class="studywrap"><div class="studybar"><button type="button" class="btn ghost" onclick="nav('library')">← Thư viện</button><span>Đã ghép ${m.done.length/2} / ${m.cards.length} cặp</span><b>${Math.floor((Date.now()-m.start)/1000)} giây</b></div><div class="panel"><h2 style="font:800 20px 'Plus Jakarta Sans';margin:0 0 15px">Chọn từ và nghĩa tương ứng</h2><div class="matchgrid">${m.tiles.map((t,i)=>`<button type="button" class="matchtile ${m.selected===i?'selected':''} ${m.done.includes(t.id+':'+t.type)?'done':''}" onclick="pickMatch(${i})">${esc(t.text)}</button>`).join('')}</div><div id="matchmsg" class="feedback"></div></div><div style="margin-top:13px;text-align:center"><button type="button" class="btn secondary" onclick="launch('${activeSet}','match')">↻ Chơi lại</button></div></div>`}function pickMatch(i){let m=matchState,t=m.tiles[i];if(m.done.includes(t.id+':'+t.type))return;if(m.selected===null){m.selected=i;drawMatch();return}let a=m.tiles[m.selected];if(a.id===t.id&&a.type!==t.type){m.done.push(a.id+':'+a.type,t.id+':'+t.type);m.selected=null;if(m.done.length===m.tiles.length){let seconds=Math.floor((Date.now()-m.start)/1000);state.matchRecords=state.matchRecords||[];state.matchRecords.push({sid:activeSet,seconds,date:today()});save();setTimeout(()=>document.getElementById('studyArea').innerHTML=`<div class="studywrap result panel"><div class="score">${seconds}s</div><h2>Hoàn thành! 🎉</h2><p class="muted">Bạn đã ghép đúng tất cả ${m.cards.length} cặp.</p><button type="button" clas function exportSet(sid){let s=setObj(sid);if(!s)return;let text=(s.cards||[]).map(c=>[c.term,c.pos||'',c.ipa||'',c.meaning||'',c.example||'',c.image||''].map(escapePipeField).join(' | ')).join('\r\n'),name=(s.title||'bo-the').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'bo-the',url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất theo mẫu dán từ (.txt).')}function importSet(sid){let s=setObj(sid);if(!s)return;let input=document.createElement('input');input.type='file';input.accept='text/plain,.txt,application/json,.json';input.style.cssText='position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0';input.onchange=()=>{let file=input.files?.[0];input.remove();if(!file)return;let reader=new FileReader();reader.onload=async()=>{try{let text=String(reader.result||'').replace(/^\uFEFF/,''),cards=null;try{let data=JSON.parse(text),incoming=data?.set||data;if(Array.isArray(incoming?.cards))cards=incoming.cards}catch{}if(!Array.isArray(cards))cards=parsePipeRows(text).valid;let target=setObj(sid);if(!target)return;if(!Array.isArray(cards)||!cards.length)throw Error('File không có thẻ theo mẫu dán từ hoặc JSON bộ thẻ.');let existing=new Set(target.cards.map(c=>String(c.term||'').trim().toLowerCase())),valid=cards.filter(c=>c&&String(c.term||'').trim()&&String(c.meaning||'').trim()),additions=[],duplicates=0;valid.forEach(c=>{let key=String(c.term).trim().toLowerCase();if(existing.has(key)){duplicates++;return}existing.add(key);additions.push({id:id(),term:String(c.term).trim(),pos:String(c.pos||''),ipa:String(c.ipa||''),meaning:String(c.meaning).trim(),definition:String(c.definition||''),example:String(c.example||''),translation:String(c.translation||''),synonyms:String(c.synonyms||''),image:String(c.image||'')})});if(!additions.length){toast(valid.length?'Các từ trong file đều đã có trong bộ này.':'File không có thẻ hợp lệ.');return}if(!confirm(`Thêm ${additions.length} thẻ mới vào “${target.title}”?${duplicates?` Bỏ qua ${duplicates} từ trùng.`:''}`))return;target.cards.push(...additions);save();let sharedUpdated=true;if(publishedDeckIds.has(target.id))sharedUpdated=await upsertSharedDeck(target);render();toast(sharedUpdated?`Đã nhập ${additions.length} thẻ vào bộ này.`:'Đã nhập vào bộ riêng nhưng chưa cập nhật được bản chia sẻ.')}catch(error){toast(error.message)}};reader.onerror=()=>toast('Không đọc được file.');reader.readAsText(file)};input.addEventListener('cancel',()=>input.remove(),{once:true});document.body.appendChild(input);input.click()}function duplicateSet(sid){let s=setObj(sid);if(!s)return;let copy=JSON.parse(JSON.stringify(s));copy.id=id();copy.title+=' (bản sao)';copy.created=today();copy.cards.forEach(c=>c.id=id());state.sets.unshift(copy);save();render();toast('Đã nhân bản bộ thẻ.')}
function setMenu(sid){let s=setObj(sid);if(!s||s._shared)return;let published=publishedDeckIds.has(sid);document.getElementById('modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px"><div class="modalhead"><h2>Tùy chọn bộ thẻ</h2><button type="button" class="close" onclick="closeModal()">×</button></div><p class="muted">${esc(s.title)}</p><div style="display:grid;gap:9px"><button type="button" class="btn secondary" onclick="closeModal();openEditor('${sid}')">Sửa bộ thẻ</button><button type="button" class="btn secondary" onclick="duplicateSet('${sid}')">Nhân bản bộ thẻ</button><button type="button" class="btn secondary" onclick="closeModal();importSet('${sid}')">Nhập file .txt hoặc JSON vào bộ này</button><button type="button" class="btn secondary" onclick="closeModal();exportSet('${sid}')">Xuất theo mẫu dán từ (.txt)</button><button type="button" class="btn secondary" onclick="closeModal();moveSetToFolder('${sid}')">Chuyển thư mục</button><button type="button" class="btn secondary" onclick="closeModal();toggleShareDeck('${sid}')">${published?'Ngừng chia sẻ':'Chia sẻ với tài khoản khác'}</button><button type="button" class="btn danger" onclick="closeModal();deleteSet('${sid}')">Xóa bộ thẻ</button></div></div></div>`}function addFolder(){let f=prompt('Tên thư mục mới:');if(f?.trim()&&!state.folders.includes(f.trim())){state.folders.push(f.trim());save();render()}}
function hardWords(){let out=[];state.sets.forEach(s=>s.cards.forEach(c=>{let p=progress(s.id,c.id);if(p.incorrect)out.push({card:c,p})}));return out.sort((a,b)=>b.p.incorrect-a.p.incorrect)}function saveSettings(){state.settings.target=Number(document.getElementById('target').value)||15;state.settings.accent=document.getElementById('accent').value;save();toast('Đã lưu cài đặt.')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-personal-quizlet-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.sets)||!Array.isArray(data.folders))throw Error();if(confirm('Nhập bản sao lưu sẽ thay thế dữ liệu hiện tại. Tiếp tục?')){state=data;save();render();toast('Đã nhập dữ liệu.')}}catch{toast('Tệp sao lưu không hợp lệ.')}};reader.readAsText(file)}function clearData(){if(confirm('Xóa vĩnh viễn tất cả bộ thẻ và lịch sử trên thiết bị này?')){localStorage.removeItem(KEY);state=load();render();toast('Đã xóa dữ liệu.')}}function exportCsv(sid){let s=setObj(sid),rows=[['English','Vietnamese','IPA','Definition'],...s.cards.map(c=>[c.term,c.meaning,c.ipa||'',c.definition||''])],csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=s.title+'.csv';a.click()}
state.sets.forEach(s=>s.cards.forEach(c=>{if(!c.id)c.id=id()}));save();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')){if(e.key==='Escape'){closeModal();toggleMobileMenu(false)};return}if(page==='flashcards'&&activeSet){if(e.code==='Space'){e.preventDefault();flipCard()}if(e.key==='ArrowRight')stepCard(1);if(e.key==='ArrowLeft')stepCard(-1)}if(e.key==='Escape'){closeModal();toggleMobileMenu(false)}});let renderedLocalStudyDay=today();function refreshStudyDayView(){let key=today();if(key!==renderedLocalStudyDay){renderedLocalStudyDay=key;if(!['flashcards','learn','test','match'].includes(page))render()}}setInterval(refreshStudyDayView,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshStudyDayView()});function boot(){render();restoreSyncSession()}boot();
